# Desenvolvimento local: backend fora do Docker, PostgreSQL no Docker (localhost:5432)

server.port=${BACKEND_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/vibeu}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:vibeu}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:dev_password_change_me}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.org.springframework.security=INFO
logging.level.org.flywaydb=INFO
